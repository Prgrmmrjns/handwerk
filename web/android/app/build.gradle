apply plugin: 'com.android.application'

def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def keyAlias = System.getenv("ANDROID_KEY_ALIAS")
def keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseKey =
    keystorePath != null &&
    !keystorePath.isEmpty() &&
    file(keystorePath).exists() &&
    keystorePassword != null &&
    keyAlias != null &&
    keyPassword != null

// Prefer CI-provided version; otherwise keep a documented manual baseline.
def ciVersionCode = System.getenv("ANDROID_VERSION_CODE")
def ciVersionName = System.getenv("ANDROID_VERSION_NAME")

android {
    namespace = "io.github.prgrmmrjns.handwerk"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.prgrmmrjns.handwerk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Manual bump: change these when not running under CI.
        // CI sets ANDROID_VERSION_CODE / ANDROID_VERSION_NAME (run number).
        versionCode ciVersionCode != null ? ciVersionCode.toInteger() : 2
        versionName ciVersionName != null ? ciVersionName : "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

afterEvaluate {
    if (hasReleaseKey) {
        logger.lifecycle("Handwerk: release signing configured from ANDROID_KEYSTORE_PATH")
    } else {
        logger.lifecycle("Handwerk: no release keystore env — release builds will be unsigned; use assembleDebug in CI fallback")
    }
}
